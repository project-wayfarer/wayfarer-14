- type: entity
  parent: DrinkGlassBase
  id: DrinkTokkuri
  name: tokkuri
  description: Floral and full of osake!
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: Sake
          Quantity: 100
  - type: Sprite
    sprite: Objects/Consumable/Drinks/saketokkuri.rsi

- type: entity
  parent: DrinkGlass # wayfarer drinkglassbase>drinkglass
  id: DrinkOrangeCreamiceGlass
#  name: orange creamcicle glass # wayfarer commented out: make inline with other metamorphic glasses
  description: Orangy, creamy goodness.
  suffix: orange creamice # wayfarer
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: OrangeCreamice
          Quantity: 30
  - type: Icon # wayfarer Sprite>Icon
    sprite: _WF/Objects/Consumable/Drinks/orangecreamcicle.rsi  # wayfarer Nyanotrasen>_WF
    state: icon # wayfarer

