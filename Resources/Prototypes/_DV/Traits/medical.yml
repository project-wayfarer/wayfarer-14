- type: trait
  id: Unborgable
  name: trait-unborgable-name
  description: trait-unborgable-desc
  category: Medical
  effects:
  - !type:AddCompsEffect
    components:
    - type: Unborgable

- type: trait
  id: Redshirt
  name: trait-redshirt-name
  description: trait-redshirt-desc
  category: Medical
  effects:
  - !type:AddCompsEffect
    components:
    - type: Redshirt
  - !type:OverrideCompsEffect
    components:
    - type: MobThresholds
      thresholds:
        0: Alive
        99.9: Critical
        100: Dead

