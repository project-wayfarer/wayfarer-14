- type: trait
  id: LightweightDrunk
  name: trait-lightweight-name
  description: trait-lightweight-desc
  category: Medical
  effects:
  - !type:AddCompsEffect
    components:
    - type: LightweightDrunk
      boozeStrengthMultiplier: 2

- type: trait
  id: Unrevivable
  name: trait-unrevivable-name
  description: trait-unrevivable-desc
  category: Medical
  effects:
  - !type:AddCompsEffect
    components:
    - type: Unrevivable
      cloneable: true

