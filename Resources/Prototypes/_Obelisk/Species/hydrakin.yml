- type: species
  id: Hydrakin
  name: species-name-hydrakin
  roundStart: true
  prototype: MobHydrakin
  sprites: MobHydrakinSprites
  defaultSkinTone: "#ffffff"
  markingLimits: MobHydrakinMarkingLimits
  dollPrototype: MobHydrakinDummy
  skinColoration: Hues
  maleFirstNames: NamesHydrakinUnisex
  femaleFirstNames: NamesHydrakinUnisex
  naming: First

- type: speciesBaseSprites
  id: MobHydrakinSprites
  sprites:
    TailBehind: MobHumanoidAnyMarking
    TailOversuit: MobHumanoidAnyMarking
    Head: MobHydrakinHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobHydrakinTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    # Eyes: MobHydrakinEyes
    LArm: MobHydrakinLArm
    RArm: MobHydrakinRArm
    LHand: MobHydrakinLHand
    RHand: MobHydrakinRHand
    LLeg: MobHydrakinLLeg
    RLeg: MobHydrakinRLeg
    LFoot: MobHydrakinLFoot
    RFoot: MobHydrakinRFoot

- type: markingPoints
  id: MobHydrakinMarkingLimits
  points:
    Special:
      points: 32 # WF
      required: false
    Head:
      points: 1 # WF
      required: false
      defaultMarkings: [ HydrakinEyesDefault ]
    HeadTop:
      points: 32 # WF
      required: false
#      defaultMarkings: [ HydrakinEarsDefault ]
    HeadSide:
      points: 32 # WF
      required: false
    Snout:
      points: 32 # WF
      required: false
    Hair:
      points: 32 # WF
      required: false
    FacialHair:
      points: 32 # WF
      required: false
    Chest:
      points: 32 # WF
      required: false
    Legs:
      points: 32 # WF
      required: false
    Arms:
      points: 32 # WF
      required: false
    Tail:
      points: 32 # WF
      required: false
#      defaultMarkings: [ HydrakinTailDefault ]
    UndergarmentTop:
      points: 32 # WF
      required: false
    UndergarmentBottom:
      points: 32 # WF
      required: false
    Overlay:
      points: 32 # WF
      required: false

