- type: trait
  id: HLBorgVoice
  name: hl-trait-borg-voice-name
  description: hl-trait-borg-voice-desc
  cost: 1
  category: Voices
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: Speech
      speechSounds: Borg
      speechVerb: Robotic
      allowedEmotes: ['Beep', 'Ping', 'Buzz', 'Buzz-Two', 'Chime', 'Honk']
    - type: Vocal
      sounds:
        Male: UnisexSilicon
        Female: UnisexSilicon
        Unsexed: UnisexSilicon
    - type: TypingIndicator
      proto: robot


