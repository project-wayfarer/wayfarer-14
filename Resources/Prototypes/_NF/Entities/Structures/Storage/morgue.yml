- type: entity
  parent: Morgue
  id: NFMorgueShip
  suffix: Ship
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1: # Wayfarer: SheetSteel1 < SheetPlasteel1
            min: 3
            max: 5
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # Wayfarer
  - type: Construction
    graph: NFMorgueShip
    node: NFMorgueShip
    containers:
    - entity_storage
  - type: Rotatable
  # End Wayfarer
