# If you add a new trait, make sure to add the corresponding component to the whitelist in \Resources\Prototypes\Entities\Mobs\Player\clone.yml so it gets copied to clones correctly!

# 1 Cost
- type: trait
  id: DwarfAccent
  name: trait-dwarf-accent-name
  description: trait-dwarf-accent-desc
  category: Accents # Wayfarer: SpeechTraits<Accents
  cost: 1
  # Wayfarer
  effects:
  - !type:AddCompsEffect
    components:
    - type: ReplacementAccent
      accent: dwarf
  # End Wayfarer

