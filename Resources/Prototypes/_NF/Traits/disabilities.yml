# If you add a new trait, make sure to add the corresponding component to the whitelist in \Resources\Prototypes\Entities\Mobs\Player\clone.yml so it gets copied to clones correctly!

- type: trait
  id: Stinky
  name: trait-stinky-name
  description: trait-stinky-desc
  category: Disabilities
  # Wayfarer
  effects:
  - !type:AddCompsEffect
    components:
    - type: StinkyTrait
  # End Wayfarer

- type: trait
  id: Clumsy
  name: trait-clumsy-name
  description: trait-clumsy-desc
  category: Disabilities
  # Wayfarer
  effects:
  - !type:AddCompsEffect
    components:
    - type: Clumsy
      gunShootFailDamage:
        types:
          Blunt: 5
          Piercing: 4
        groups:
          Burn: 3
  # End Wayfarer

- type: trait
  id: Unclonable
  name: trait-unclonable-name
  description: trait-unclonable-desc
  category: Disabilities
  # Wayfarer
  effects:
  - !type:AddCompsEffect
    components:
    - type: Unclonable
  # End Wayfarer

# Upstream
- type: trait
  id: WheelchairBound
  name: trait-wheelchair-bound-name
  description: trait-wheelchair-bound-desc
  category: Disabilities
  # Wayfarer
  conditions:
  - !type:HasCompCondition
    component: BorgChassis
    invert: true
  effects:
  - !type:AddCompsEffect
    components:
    - type: BuckleOnMapInit
      prototype: VehicleWheelchair
    - type: LegsParalyzed
  # End Wayfarer
