- type: job
  id: PlantTechnician
  name: job-name-plant-technician
  description: job-description-plant-technician
  playTimeTracker: JobPlantTechnician
  requirements:
    - !type:RoleTimeRequirement
      role: JobWayfarer
      time: 7200 # 2 hours as Wayfarer
  startingGear: PlantTechnicianGear
  alwaysUseSpawner: true
  icon: "JobIconPlantTechnician"
  supervisors: job-supervisors-plant-manager
  weight: 80
  displayWeight: 0
  access:
  - Engineering
  - Atmospherics
  accessGroups:
  - GeneralAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, NFSDTrackingImplant ]
  # Wayfarer
  - !type:AddComponentSpecial
    components:
      - type: PreventShipyardTitleOverwrite
  # End Wayfarer
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  # Wayfarer: Spooky month!
  - !type:GiveItemOnHolidaySpecial
    holiday: Halloween
    prototype: TreatBagRandomTreat
  # End Wayfarer

- type: startingGear
  id: PlantTechnicianGear
  equipment:
    pocket2: HolofanProjector

- type: chameleonOutfit
  id: PlantTechnicianChameleonOutfit
  job: PlantTechnician
  hasMindShield: true
  equipment:
    head: ClothingHeadHatHardhatYellow
    mask: ClothingMaskBreath
    neck: ClothingNeckScarfStripedOrange
    outerClothing: ClothingOuterWinterEngi
    gloves: ClothingHandsGlovesColorYellow
    shoes: ClothingShoesBootsMag
