# To add an objective, write a trait in the category below with hidden: true, so it stays off the
# traits tab and doesn't contribute to trait limits. Put that trait's id in the objective's trait field.
#
# The current objective completion triggers are:
#   Critical     Pays the outlaw responsible for the target reaching critical condition. Stops being
#                listed once the target is dead.
#   Gibbed       Pays the outlaw responsible for destroying the body.
#   ItemSold     Pays when an outlaw sells the objective's item on a contraband pad.
#   ShipSold     Pays when an outlaw sells the target's ship with a forged deed at a console listed in
#                the sector service settings. Waits in the pending pool until the target owns a ship.
#   ShipDamaged  Pays once one outlaw has destroyed a percentage of the ship's anchored things
#                with health (walls, windows, airlocks, thrusters, machines, furniture). Waits like ShipSold.
# Anything else needs a new trigger added to the payout system.

- type: traitCategory
  id: WFOutlawObjectives
  name: humanoid-profile-editor-outlaw-objectives-tab

- type: trait
  id: WFTraitOutlawCritical
  category: WFOutlawObjectives
  name: outlaw-objectives-critical
  description: outlaw-objectives-note
  hidden: true
  conflicts:
  - WFTraitOutlawRoundRemoval

- type: trait
  id: WFTraitOutlawRoundRemoval
  category: WFOutlawObjectives
  name: outlaw-objectives-round-removal
  description: outlaw-objectives-note
  hidden: true
  conflicts:
  - WFTraitOutlawCritical

- type: trait
  id: WFTraitOutlawTheft
  category: WFOutlawObjectives
  name: outlaw-objectives-theft
  description: outlaw-objectives-note
  hidden: true

- type: trait
  id: WFTraitOutlawShipTheft
  category: WFOutlawObjectives
  name: outlaw-objectives-ship-theft
  description: outlaw-objectives-note
  hidden: true

- type: trait
  id: WFTraitOutlawShipDamage
  category: WFOutlawObjectives
  name: outlaw-objectives-ship-damage
  description: outlaw-objectives-note
  hidden: true

- type: outlawObjective
  id: WFOutlawObjectiveCritical
  rewardDC: 15
  rewardSpesos: 100000
  trigger: Critical
  trait: WFTraitOutlawCritical
  title: outlaw-objectives-critical-title
  description: outlaw-objectives-critical-description

- type: outlawObjective
  id: WFOutlawObjectiveRoundRemoval
  rewardDC: 30
  rewardSpesos: 250000
  trigger: Gibbed
  trait: WFTraitOutlawRoundRemoval
  title: outlaw-objectives-round-removal-title
  description: outlaw-objectives-round-removal-description

- type: outlawObjective
  id: WFOutlawObjectiveTheft
  rewardDC: 20
  rewardSpesos: 150000
  trigger: ItemSold
  trait: WFTraitOutlawTheft
  item: WFOutlawObjectiveDataDrive
  title: outlaw-objectives-theft-title
  description: outlaw-objectives-theft-description

- type: outlawObjective
  id: WFOutlawObjectiveShipTheft
  rewardDC: 40
  rewardSpesos: 400000
  trigger: ShipSold
  trait: WFTraitOutlawShipTheft
  title: outlaw-objectives-ship-theft-title
  description: outlaw-objectives-ship-theft-description

- type: outlawObjective
  id: WFOutlawObjectiveShipDamage
  rewardDC: 25
  rewardSpesos: 200000
  trigger: ShipDamaged
  trait: WFTraitOutlawShipDamage
  title: outlaw-objectives-ship-damage-title
  description: outlaw-objectives-ship-damage-description

# Renamed after its owner when it spawns. turnInValues has to name the contraband pad's own currency
# or the pad refuses to take it, and the zero is what stops the pad paying for it on top of the objective reward.
- type: entity
  parent: BaseItem
  id: WFOutlawObjectiveDataDrive
  name: data drive
  description: This looks important.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: harddisk_micro
    scale: -1, 1
  - type: Item
    size: Tiny
  - type: Contraband
    severity: PirateTarget
    turnInValues:
      Doubloon: 0
    hideValues: true

- type: entity
  parent: BaseShipVoucher
  id: WFForgedShipDeed
  name: forged ship deed
  description: A ship deed that is clearly falsified.
  components:
  - type: Sprite
    layers:
    - state: centcomm
    - state: vouchercentcomm
  - type: Item
    heldPrefix: centcomm
  - type: ShipyardVoucher
    redemptionsLeft: 0
    consoleType: BlackMarket
  - type: ForgedDeed
