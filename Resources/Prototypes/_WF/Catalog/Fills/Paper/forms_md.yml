# MD Forms
# Modified By Cyanfoot, using forms from Frontier and RMC

# Filled Folder
- type: entity
  id: BoxFolderMedicalDoctor
  parent: BoxFolderBase
  name: medical doctor folder
  description: A folder filled with medical paperwork templates.
  suffix: Forms
  components:
  - type: Sprite
    layers:
    - state: folder-white
    - state: folder-base
  - type: StorageFill
    contents:
    - id: PaperWrittenMedicalFormERDutyLog
    - id: PaperWrittenMedicalFormPrescription
    - id: PaperWrittenMedicalFormExamination
    - id: PaperWrittenMedicalFormServiceInvoice
    - id: PaperWrittenMedicalFormReceiptInvoice
    - id: PaperWrittenMedicalFormRelease
    - id: PaperWrittenMedicalCommunication
    - id: PaperWrittenMedicalTrainingChecklist
    - id: Paper
      prob: 0.5
    - id: Paper
      prob: 0.5
  - type: StaticPrice
    price: 100
    vendPrice: 500

