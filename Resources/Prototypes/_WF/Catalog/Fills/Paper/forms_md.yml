            [color=#ff0000]*[/color][color=#5b97bc][bold]Name:[/bold][/color] [form]
            [color=#ff0000]*[/color][color=#5b97bc][bold]Position:[/bold][/color] [form]

            [color=#AAAAAA](Times in D:HH:MM:SS. Round to nearest 15 minutes.)[/color]
            [bold]Hours Worked:[/bold]
            Start Time | End Time | Hours Accrued | No. Responses | Paid? | Paying Staff
            [form] | [form] | [form] | [form] | [check] | [signature]
            [form] | [form] | [form] | [form] | [check] | [signature]
            [form] | [form] | [form] | [form] | [check] | [signature]
            [form] | [form] | [form] | [form] | [check] | [signature]
            [form] | [form] | [form] | [form] | [check] | [signature]
            [form] | [form] | [form] | [form] | [check] | [signature]
            [form] | [form] | [form] | [form] | [check] | [signature]

      [color=#5b97bc][bold]Expenditures for the Duty Period:[/bold][/color] [color=#AAAAAA](List all funds paid by you for MD benefit, eg. paid out for shared medical supplies if no DoC present. Supplies for personal/crew use are not included)[/color]
            [form]
            [form]
            [form]




            [color=#AAAAAA] The requested signatories confirm all information on this report is accurate and correct to the best of their knowledge at the time of signing. Any details proven incorrect, falsified, or exaggerated may result in charges and/or this document being void.
            This document is void without the signatures of ticked parties: (NB: Some parties may be the same person, only one signature is needed from the person in that case.)[/color]
            ☑ [color=#AAAAAA]The Author[/color]
            ☑ [color=#AAAAAA]The Approver[/color]
