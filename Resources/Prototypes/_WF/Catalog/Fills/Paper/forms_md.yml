- type: entity
  id: PaperWrittenMedicalTrainingChecklist
  name: medical intern training checklist
  categories: [ HideSpawnMenu ]
  parent: Paper
  components:
  - type: Paper
    content: |2
      [color=#5b97bc]◥[bold]MD[/bold]◣ [bold]Medical Directorate[/bold][/color]
            [color=#5b97bc]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]
            [head=2]Medical Intern Training Checklist[/head]

            Medical Intern Name: [form]

            [head=3]Basic Orientation[/head]
      [italic]      The very basics of the job.
      [/italic]      [bullet]Teach the trainee about Medical Implants: ([check])
            [bullet]Tour of Dusk Medical: ([check])      
            [bullet]Show the trainee a NanoMed and First Aid Kit: ([check])
            [bullet]Have the trainee display or talk through basic first aid:
                  [bullet]Triaging damage:
                          [bullet] With an analyser:([check])
                          [bullet] Without an analyser:([check])
                  [bullet]The use of Gauze, Bruise Packs, Ointment, Blood Bags ([check])
                  [bullet]The use of the Emergency and Space Pens([check])

      
            [head=3]Basic Medical Treatment[/head]
      [italic]      What's needed to save a life.
      [/italic]      [bullet]Teach the trainee to administer injections and hyposprays ([check])
            [bullet]Teach the trainee the basic chems to use for all damage types ([check])
            [bullet]Teach the trainee to use a defibrillator ([check])
            [bullet]Teach the trainee the basics of treating species with:
                  [bullet]non-standard Blood-type (Avali, Chitinid, Vox) ([check])
                  [bullet]non-standard Respiratory Systems (Vox, Slime) ([check])
                  [bullet]non-standard Body temperature (Sheleg) ([check])
                  [bullet]synthetic components (IPCs) ([check])


            [head=3]Basic Chemical Synthesis[/head]
      [italic]      Enough to get by without a pharmacist
      [/italic]      [bullet]Teach the trainee to produce basic chems in the dispenser: ([check])
            [bullet]Teach the trainee to heat chemicals: ([check])
            [bullet]Teach the trainee to seperate chemicals in the Chemmaster: ([check])
            [bullet]Teach the trainee how to make pills and auto-injectors: ([check])
            [bullet]Teach the trainee how to make basic and advanced Topicals : ([check])


            [head=3]Advanced Medical treatment[/head]
      [italic]      In centuries past, they would have called this Necromancy.
      [/italic]      [bullet]Teach the trainee about the Medical Bounty system: ([check])
            [bullet]Teach the trainee about surgery: ([check])
            [bullet]Teach the trainee about cryotreatment: ([check])
            [bullet]Teach the trainee about cloning: ([check])
            [bullet]Teach the trainee about non-damage medicines (e.g Oculine, Psicodine, Mannitol): ([check])


            [head=3]Emergency Response Orientation[/head]
      [italic]      Don't crash into CGPO.
      [/italic]      [bullet]Teach the trainee different ships: ([check])
            [bullet]Teach the trainee about upgrades: ([check])
            [bullet]Equip the trainee for EVA recovery: ([check])
            [bullet]Teach the trainee EVA recovery: ([check])
            [bullet]Teach the trainee about printing and signing receipts: ([check])
            [bullet]Teach the trainee stasis beds and body preservation: ([check])
            [bullet]Teach the trainee about combat situations: ([check])
            [bullet]Teach the trainee about the important of a clean medbay:([check])

            Get the trainee paid in order to end on a high note: ([check])



- type: entity
  id: PaperWrittenMedicalMedtekPatientRecord
  parent: Paper
  name: Patient Record
  categories: [ HideSpawnMenu ]
  description: A printed medical patient record.
  components:
  - type: Tag
    tags:
    - Document
    - Trash
    - Paper
  - type: StaticPrice
    price: 0
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper_receipt
    - state: paper_receipt_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_perforated.svg.96dpi.png"
    headerImagePath: "/Textures/_NF/Interface/Paper/paper_heading_medtek_report.svg.96dpi.png"
    headerMargin: 0.0, 0.0, 0.0, 6.0
    backgroundImageTile: true
    backgroundPatchMargin: 0.0, 6.0, 0.0, 6.0
    contentMargin: 12.0, 0.0, 12.0, 0.0
    # This is a narrow piece of paper
    maxWritableArea: 256.0, 0.0
  - type: Paper
    content: |
      [head=3]Patient[/head]
      [bold]Name:[/bold] {patient.name}
      [bold]Species:[/bold] {patient.species}

      [head=3]Responder[/head]
      [bold]Name:[/bold] {responder.name}
      [bold]Shift Time:[/bold] {roundTime}

      [head=3]Injuries[/head]
      {damageList}
