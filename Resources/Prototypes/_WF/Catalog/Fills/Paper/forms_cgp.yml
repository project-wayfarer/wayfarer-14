      [bullet]Teach the recruit the importance of backup weapons, typically in case of EMP: ([check])
      [bullet]Teach the recruit about explosive safety: ([check])
      [bullet]Teach the recruit about meds and what they need: ([check])
      [bullet]Let the recruit make their own combat bag: ([check])
