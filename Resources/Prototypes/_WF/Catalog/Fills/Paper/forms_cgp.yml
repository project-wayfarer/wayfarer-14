      The fun part.
      [bullet]Teach the recruit fire positions, prone/standing: ([check])
      [bullet]Teach the recruit corner peeking and give examples on both sides: ([check])
      [bullet]Teach the recruit distance bias, with an example: ([check])
      [bullet]Teach the recruit the importance of teamwork and coordination: ([check])
      [bullet]Teach the recruit Disable, Open, Entry on an example area, alongside others: ([check])

      [head=3]Basic Document Orientation[/head]
      Paperwork is dull, but is proof of what you did. Never lie on it.
      [bullet]Teach the recruit after-action reports and arrest warrants: ([check])
      [bullet]Teach the recruit about contraband turn ins and permits, alongside permit fees: ([check])

