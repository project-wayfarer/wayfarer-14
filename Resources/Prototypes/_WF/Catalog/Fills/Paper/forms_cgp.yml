  components:
  - type: Paper
    content: |2
      [color=#cf7332]◥[bold]CGP[/bold]◣ [bold]Concordia's Guardians of Peace[/bold][/color]
      [color=#cf7332]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]
      [head=2]Authorization for Bluespace Threats[/head]

      [head=3]Contraband Holder[/head]
          [bold]Name:[/bold]
          [bold]Species:[/bold]
          [bold]Vessel IFF:[/bold]

      [bold]Holder Crew:[/bold]
          [bullet/]
          [bullet/]
          [bullet/]

      [bold]Payout per FUC:[/bold] [color=#ff0000]$2,000[/color]
      [bold]Shift Time:[/bold]

      This document is a contract between the above Contraband Holder and Concordia Command.

      Any crimes of contraband possession for the Contraband Holder will be waived so long as all class 3 contraband items, and any class 2 contraband items not subject to a Class 2 Contraband Permit are turned in within reasonable time (subject to the clause below), and not used for malicious purposes. Noncompliance with this document results in voiding any standing Class 2 Contraband Permits.

      If the Contraband Holder is not paid in full at the above rate for any contraband turned in, they may remain in possession of the contraband without penalty at their discretion.

      This Permit allows the Holder and crew, as listed above, to possess and use class 2 contraband.
      Non-compliance with a Contraband Amnesty agreement voids this Permit.
      Refer to §6.1.4 of Space Law for a full definition of class 2 contraband.

      This document authorizes the above vessel and its captain to assist and cooperate with the CGP and Concordia authorities in neutralizing hostile bluespace threats to Concordia. These include, but are not limited to:
         [bullet] Cultist vessels
         [bullet] Syndicate vessels
         [bullet] Wizard Federation vessels
         [bullet] Arcadia Industries vessels

      This document does NOT deputize the authorized party. The authorized party is not granted special privileges to arrest, detain, and prosecute individuals associated with Concordia.

      [bold]Any contraband seized during operations aboard hostile vessels must be surrendered, either to the CGP or the Station Representative, for a cash bounty. Failure to surrender contraband will lead to the forfeiture of this agreement, and the authorized party may be liable for criminal charges.[/bold]

      The authorized party is to keep a copy of this document for inspection. The authorized party is expected to maintain contact with CGP command and/or the Station Representative to minimize casualties.

      Before engaging with hostile vessels, the authorized party is expected to follow any instructions given by the CGP for staging or other preparation prior to boarding.



      [color=#AAAAAA]This Permit is void without the signature of the Holder and the signature and stamp of the Master-at-Arms or Commodore.[/color]

