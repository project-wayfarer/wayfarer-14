      Don't crash into Dusk.
      [bullet]Teach the recruit different ships: ([check])
      [bullet]Teach the recruit about upgrades: ([check])
      [bullet]Equip the recruit for space EVA combat: ([check])
      [bullet]Teach the recruit space EVA combat: ([check])
      [bullet]Teach the recruit about ship-to-ship combat: ([check])
      [bullet]Teach the recruit about ship inspections and search: ([check])
      [bullet]Teach the recruit about safety aboard ships, and ship weapon safety: ([check])

      Get the recruit paid in order to end on a high note: ([check])

