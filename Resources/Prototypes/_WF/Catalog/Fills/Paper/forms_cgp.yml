      The very basics of the job.
      [bullet]Teach the recruit about duty papers: ([check])
      [bullet]Have the recruit fill out their duty paper correctly: ([check])
      [bullet]Tour of the outpost: ([check])
      [bullet]Teach the recruit about Zekke Credits: ([check])
      [bullet]Show the recruit a uplink: ([check])
      [bullet]Have the recruit display or talk through appropriate escalation: ([check])

      [head=3]Gear Orientation[/head]
      What they need in order not to be killed in 5 seconds.
      [bullet]Teach the recruit about their patrol suit: ([check])
      [bullet]Teach the recruit about the combat suit: ([check])
      [bullet]Teach the recruit appropriate times for standard gear and combat gear: ([check])
      [bullet]Teach the recruit about the importance of plates: ([check])
