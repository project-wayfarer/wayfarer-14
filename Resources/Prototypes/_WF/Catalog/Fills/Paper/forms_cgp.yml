      Scan them and detonate them.
      [bullet]Teach the recruit about paper reports turned into CGP: ([check])
      [bullet]Teach the recruit about the scanner and the logprobe: ([check])
      [bullet]Teach the recruit how to deal with dead drops: ([check])
      [bullet]Teach the recruit about radio scanner calls: ([check])
      [bullet]Teach the recruit how to deal with pods and how to dispose of pods: ([check])

