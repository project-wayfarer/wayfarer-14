    - id: PaperWrittenNfsdContrabandTurnover
    - id: PaperWrittenNfsdContrabandPermit
    - id: PaperWrittenCGPBMContrabandPermit
#    - id: PaperWrittenNFSDWritOfTheFrontier
    - id: Paper
      prob: 0.5
    - id: Paper
      prob: 0.5

