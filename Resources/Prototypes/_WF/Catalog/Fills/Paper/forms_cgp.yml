- type: entity # Based on form made by Starly (Shaw Clifflower)
  id: PaperWrittenNfsdAuthorization
  name: authorization for bluespace threats
  parent: Paper
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: |2 # When updating this, update PaperWrittenFrontierAuthorization
      [color=#cf7332]◥[bold]CGP[/bold]◣ [bold]Concordia's Guardians of Peace[/bold][/color]
      [color=#cf7332]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]
      [head=2]Authorization for Bluespace Threats[/head]

      [bold]Vessel Captain:[/bold]
      [bold]Vessel IFF:[/bold]
      [bold]Shift Time:[/bold]

      [head=3][bold]Issuing Concordia Authority[/bold][/head]
      [bold]Commanding Officer Name:[/bold]
      [bold]Commanding Officer Rank:[/bold]

      This document authorizes the above vessel and its captain to assist and [bold]cooperate with the CGP and Concordia authorities[/bold] in neutralizing [bold]hostile bluespace threats[/bold] to Concordia. These include, but are not limited to:
          [bullet] Cultist vessels
          [bullet] Syndicate vessels
          [bullet] Wizard Federation vessels
          [bullet] Arcadia Industries vessels

      This document [bold]does NOT deputize[/bold] the authorized party. The authorized party is not granted special privileges to arrest, detain, and prosecute individuals associated with Concordia.

      [bold]Any contraband[/bold] seized during operations aboard hostile vessels [bold]must be surrendered[/bold], either to the CGP or the Station Representative, for a cash bounty. Failure to surrender contraband will lead to the forfeiture of this agreement, and the authorized party may be liable for criminal charges.

      The authorized party is to [bold]keep a copy of this[/bold] document for inspection. The authorized party is expected to [bold]maintain contact with CGP[/bold] command and/or the Station Representative to minimize casualties.

      [bold]Before engaging[/bold] with hostile vessels, the authorized party is expected to [bold]follow any instructions given by the CGP[/bold] for staging or other preparation prior to boarding.



      [color=#AAAAAA]This Form is void without the signatures of both the permitted Captain and the issuing Commanding Officer, as well as their stamp when one is available at their rank.[/color]

- type: entity # Based on form made by Red
  id: PaperWrittenNFSDWritOfTheFrontier
  name: authorization for bluespace threats
  parent: Paper
