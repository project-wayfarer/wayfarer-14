- type: inventoryTemplate
  id: borgShortUtility
  slots:
  - name: head
    slotTexture: head
    slotFlags: HEAD
    uiWindowPos: 1,0
    strippingWindowPos: 0,0
    displayName: Head
    offset: 0.015625, -0.1875
  - &backSlot
    name: back
    slotTexture: back
    fullTextureName: template_small
    slotFlags: BACK
    stripTime: 6
    uiWindowPos: 1,1
    strippingWindowPos: 0,1
    displayName: Back
    blacklist:
      tags:
      - PetOnly
  - &idSlot
    name: id
    slotTexture: id
    fullTextureName: template_small
    slotFlags: IDCARD
    stripTime: 6
    uiWindowPos: 0,0
    strippingWindowPos: 1,0
    displayName: ID
  - &walletSlot
    name: wallet
    slotTexture: wallet
    slotFlags: WALLET
    stripTime: 6
    uiWindowPos: 2,0
    strippingWindowPos: 1,1
    displayName: Wallet

- type: inventoryTemplate
  id: borgTallUtility
  slots:
  - name: head
    slotTexture: head
    slotFlags: HEAD
    uiWindowPos: 1,0
    strippingWindowPos: 0,0
    displayName: Head
    offset: 0.015625, 0
  - *backSlot
  - *idSlot
  - *walletSlot

- type: inventoryTemplate
  id: borgDutchUtility
  slots:
  - name: head
    slotTexture: head
    slotFlags: HEAD
    uiWindowPos: 1,0
    strippingWindowPos: 0,0
    displayName: Head
    offset: 0, 0.09375
  - *backSlot
  - *idSlot
  - *walletSlot
