- type: entity
  name: decrypted data (low value)
  id: SpawnRandomDecryptedBlueprintLow
  parent: MarkerBasePlaceFree
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _Mono/Objects/Specific/Rogue/rogue_chits.rsi
      state: chits
    - sprite: _NF/Markers/general.rsi
      state: questionmark
      color: red
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: TableRandomDecryptedBlueprintLow

- type: entityTable
  id: TableRandomDecryptedBlueprintLow
  table: !type:GroupSelector
    children:
    - id: WFBlueprintOutlawSMG
      weight: 2.25

- type: latheRecipe
