# Sticking a Marshmallow
- type: constructionGraph
  id: MarshmallowOnStick
  start: start
  graph:
  - node: start
    edges:
    - to: sticked-marshmallow
      steps:
      - tag: WFStickFood
        name: construction-graph-tag-marshmallow
        completed:
        - !type:PlaySound
          sound: /Audio/Effects/sizzle.ogg
  - node: sticked-marshmallow
    entity: FoodMarshmallowStick

