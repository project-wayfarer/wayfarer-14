- type: entity
  id: WFWeaponCGPEnergyShotgun
  parent: [ WFBaseWeaponFrameEnergyShotgun, WFBaseWeaponEnergyShotgunFireModes, BaseCGPContraband ]
  name: Experimental Energy Shotgun
  description: |-
    An experimental energy shotgun with three different bursts. Wide, narrow, and disabler.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/energy_shotgun.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-4
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/energy_shotgun.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: Item
    sprite: Objects/Weapons/Guns/Battery/inhands_64x.rsi
    heldPrefix: energy
  - type: GunRequiresWield
  - type: GenericVisualizer
    visuals:
      enum.BatteryWeaponFireModeVisuals.State:
        Firemode:
          Wide: { state: wide }
          Narrow: { state: narrow }
          Disable: { state: disable }