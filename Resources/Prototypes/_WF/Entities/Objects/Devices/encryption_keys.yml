- type: entity
  parent: [EncryptionKey]
  id: EncryptionKeyHorny
  name: horny encryption key
  description: An encryption key for the Horny channel. For horny discussion.
  components:
  - type: EncryptionKey
    channels:
    - Horny
    defaultChannel: Horny
  - type: Item
    sprite: _WF/Objects/Devices/encryption_keys.rsi
  - type: Sprite
    sprite: _WF/Objects/Devices/encryption_keys.rsi
    layers:
    - state: crypt_horny
    - state: horny_label

- type: entity
  parent: [EncryptionKey]
  id: EncryptionKeyExtremeKink
  name: extreme kink encryption key
  description: An encryption key for the Extreme Kink channel. For the discussion of extreme kinks.
  components:
  - type: EncryptionKey
    channels:
    - ExtremeKink
    defaultChannel: ExtremeKink
  - type: Item
    sprite: _WF/Objects/Devices/encryption_keys.rsi
  - type: Sprite
    sprite: _WF/Objects/Devices/encryption_keys.rsi
    layers:
    - state: crypt_extreme
    - state: extreme_label

- type: entity
  parent: [EncryptionKey]
  id: EncryptionKeyInterstellar
  name: interstellar encryption key
  description: An encryption key for the Interstellar channel. For communication between a solar body and space. Requires the RAEWS Relay system to be active and operational to use.
  components:
  - type: EncryptionKey
    channels:
    - Interstellar
    defaultChannel: Interstellar
  - type: Item
    sprite: _WF/Objects/Devices/encryption_keys.rsi
  - type: Sprite
    sprite: _WF/Objects/Devices/encryption_keys.rsi
    layers:
    - state: crypt_silver
    - state: interstellar_label

