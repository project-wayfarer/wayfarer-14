- type: entity
  name: dylovene auto-injector
  parent: NFChemicalMedipen
  id: DyloveneAutoInjector
  description: A rapid dose of dylovene and saline inteded to get someone up quickly of the vox species.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#3a1d8a"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#3a1d8a"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: _WF/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: dylovenepen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    emptySpriteName: dylovenepen_empty
  - type: Hypospray
    transferAmount: 35
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 35
        reagents:
        - ReagentId: Dylovene
          Quantity: 15
        - ReagentId: Saline
          Quantity: 20

- type: entity
  name: amoxla auto-injector
  parent: NFChemicalMedipen
  id: AmoxlaAutoInjector
  description: A rapid dose of amoxla intended to get someone up quickly of the avali species.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#51c38c"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#51c38c"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: _WF/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: amoxlapen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    emptySpriteName: amoxlapen_empty
  - type: Hypospray
    transferAmount: 15
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: Amoxla
          Quantity: 15
