# Please Keep This Alphabetical as we add/port more clothing items from other forks.
- type: entity
  parent: VendingMachine
  id: VendingMachineCoyote
  name: CoyoteDrobe
  description: A boutique vending machine that offers clothing from a sector named Coyote.
  components:
  - type: VendingMachine
    pack: CoyoteVendInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
#    ejectState: eject-unshaded
    ejectDelay: 1.8
  - type: DatasetVocalizer
    dataset: CoyoteAds
  - type: SpeakOnUIClosed
    pack: CoyoteGoodbyes
  - type: Sprite
    sprite: _WF/Structures/Machines/VendingMachines/coyote.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#326e3f"

