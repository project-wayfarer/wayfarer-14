#  priorities of which folder if ship is in multiple shipyards
  # 1: civilian
  # 2: CGP (generally if it has a gun its gonna be this one or outlaw)
  # 3: Medical
  # 4: Outlaw
  # 5: Syndicate
  # 6: Exped
  # 7: Staff
  # 8: Scrap
    #  example you have a staff ship that also is in the civilian ship yard the files would go to civilian

