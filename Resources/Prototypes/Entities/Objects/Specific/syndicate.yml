- type: entity
  name: warpglass
  parent: [BaseItem, BaseBMContraband] # Wayfarer: BaseSyndicateContraband<BaseBMContraband
  id: Telecrystal
  suffix: 20 WG # Wayfarer: TC<WG
  description: Favored by smugglers, it feels unnaturally cold to the touch. # Wayfarer: changed description
  components:
  - type: Sprite
    sprite: _WF/Objects/Specific/Outlaw/warpglass.rsi # Wayfarer: changed sprite
    state: warpglass
  - type: Item
    sprite: _WF/Objects/Specific/Outlaw/warpglass.rsi # Wayfarer: changed sprite
    size: Tiny
  - type: PointLight
    radius: 1.2
    energy: 30
    color: "#8099ff"
  - type: Stack
    count: 20
    stackType: Telecrystal
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 200
  - type: Currency
    price:
      Telecrystal: 1
# Wayfarer: Add tag whitelist
  - type: Tag
    tags:
    - FitsWallet
# End Wayfarer

