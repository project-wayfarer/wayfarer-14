# Uplinks
- type: entity
  parent: [BaseItem, StorePresetUplink, BaseBMContraband] # Wayfarer: BaseSyndicateContraband<BaseBMContraband
  id: BaseUplinkRadio
  name: contraband uplink # Wayfarer: Syndicate<Contraband
  description: A suspicious looking old radio... # Wayfarer: changed description
  suffix: Empty
  components:
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: old-radio
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: old-radio
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    balance:
      Telecrystal: 0

- type: entity
  parent: BaseUplinkRadio
  id: BaseUplinkRadio20TC
  suffix: 20 WG
  components:
  - type: Store
